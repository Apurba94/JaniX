# Builds JaniX for Android (an installable APK) and checks that the iPhone app
# compiles. Run it from the Actions tab, or it runs when mobile/ changes.
name: JaniX Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "src/renderer/styles.css", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node build.mjs
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JaniX-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: JaniX-android-apk, path: mobile/JaniX-1.1.0.apk, if-no-files-found: error }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: node build.mjs
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing needed)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build | tail -n 40
      - name: Check the build succeeded
        run: ls -d ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/App.app
